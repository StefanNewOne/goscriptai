services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: goscript
      POSTGRES_PASSWORD: goscript
      POSTGRES_DB: goscriptai
    ports:
      - "5435:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goscript -d goscriptai"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6383:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # api and web services are added when their Dockerfiles land (Sprint 4 / deploy).
  # nginx:
  #   image: nginx:1.27-alpine
  #   ports: ["80:80"]
  #   volumes: [./nginx.conf:/etc/nginx/nginx.conf:ro]
  #   depends_on: [api, web]

volumes:
  db_data:
  redis_data:
